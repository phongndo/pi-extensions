name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, and Pi smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # Only the Pi host CLI needs Node; repository tooling runs on Bun.
      - name: Set up Pi host runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Cache dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-

      - name: Verify Bun version
        run: test "$(bun --version)" = "$(bun -p 'require("./package.json").engines.bun')"

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile

      # Includes skill tests and each workspace's tests; no second bun test pass.
      - name: Check formatting, lint, types, and tests
        run: bun run check

      - name: Smoke test the locked Pi host
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PI_BIN: ${{ github.workspace }}/node_modules/.bin/pi
        run: bun run test:pi-skills
